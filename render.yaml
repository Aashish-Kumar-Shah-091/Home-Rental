databases:
  - name: homerental-db
    plan: free
    databaseName: homerental
    user: homerental_user

services:
  - type: web
    name: homerental
    runtime: python
    plan: free
    buildCommand: ./build.sh
    startCommand: daphne -b 0.0.0.0 -p $PORT HomeRental.asgi:application
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: homerental-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://*.onrender.com
      - key: PYTHON_VERSION
        value: "3.12.4"
      - key: CLOUDINARY_URL
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
